name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  # Linux 6.18+ is required. SEND_ZC runtime checks need a suitable network
  # environment; keep their pure encoding and lifecycle tests in CI.
  URING_CI_UNSUPPORTED_ZC_TESTS: '^Test(IntegrationZeroCopySend|ZCTrackerBasic|ZCTrackerPoolExhaustion|ZCTrackerHandlerOrder|ZCTrackerExactlyOnce|ZCTrackerGCSafety|SendZeroCopyFixed|ZeroCopyNotificationFlags|SendZeroCopyFixedMultiTarget|ZeroCopyBufferSafety|ZeroCopyLargeBuffer|ZeroCopyMultipleBuffers|ZeroCopyErrorHandling|ZeroCopySequentialSends|ZeroCopyNotificationOverhead|ZeroCopyVsNormalComparison|MultiDestinationComparison)$'
  URING_CI_UNSUPPORTED_ZC_EXAMPLES: '^Test(ZCTrackerBasic|MulticastZeroCopy)$'

jobs:
  lint-build-test-linux:
    name: Lint, Build & Test (Linux/amd64, Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go-version: [ '1.26.x', 'stable' ]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true

      - name: Check runner environment
        run: |
          cat /etc/os-release
          uname -a
          go version
          echo "Image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          kernel=$(uname -r)
          IFS=. read -r major minor _ <<< "$kernel"
          if (( major < 6 || (major == 6 && minor < 18) )); then
            echo "::error::Linux 6.18+ is required; runner uses $kernel"
            exit 1
          fi

      - name: Check formatting
        run: |
          output=$(gofmt -l .)
          if [ -n "$output" ]; then
            echo "Files need formatting:"
            echo "$output"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        env:
          CGO_ENABLED: '0'
        run: go build ./...

      # Each test shell raises its own memlock limit for child test processes.
      # Coverage uses the stable normal run, with the same required tests.
      - name: Test root package
        env:
          GO_VERSION: ${{ matrix.go-version }}
        run: |
          sudo prlimit --pid "$$" --memlock=unlimited:unlimited
          ulimit -l
          coverage=()
          if [ "$GO_VERSION" = stable ]; then
            coverage=(-covermode=count -coverprofile=coverage.out)
          fi
          go test -v -count=1 -timeout=120s "${coverage[@]}" -skip "$URING_CI_UNSUPPORTED_ZC_TESTS" . 2>&1 | tee "$RUNNER_TEMP/uring-root-tests.log"

      - name: Test root package with race detector
        run: |
          sudo prlimit --pid "$$" --memlock=unlimited:unlimited
          go test -race -v -count=1 -timeout=120s -skip "$URING_CI_UNSUPPORTED_ZC_TESTS" . 2>&1 | tee "$RUNNER_TEMP/uring-root-race.log"

      - name: Test examples
        run: |
          sudo prlimit --pid "$$" --memlock=unlimited:unlimited
          go test -v -count=1 -timeout=120s -skip "$URING_CI_UNSUPPORTED_ZC_EXAMPLES" ./examples 2>&1 | tee "$RUNNER_TEMP/uring-examples-tests.log"

      - name: Test examples with race detector
        run: |
          sudo prlimit --pid "$$" --memlock=unlimited:unlimited
          go test -race -v -count=1 -timeout=120s -skip "$URING_CI_UNSUPPORTED_ZC_EXAMPLES" ./examples 2>&1 | tee "$RUNNER_TEMP/uring-examples-race.log"

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: uring-test-logs-${{ matrix.go-version }}
          path: ${{ runner.temp }}/uring-*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload coverage artifact
        if: matrix.go-version == 'stable'
        uses: actions/upload-artifact@v7
        with:
          name: uring-root-coverage
          path: coverage.out
          if-no-files-found: error
          retention-days: 7

  vet-build-darwin:
    name: Vet & Build (Darwin/arm64, Go ${{ matrix.go-version }})
    runs-on: macos-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go-version: [ '1.26.x', 'stable' ]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true

      - name: Vet
        run: go vet ./...

      - name: Build
        env:
          CGO_ENABLED: '0'
        run: go build ./...

      - name: Compile tests
        env:
          CGO_ENABLED: '0'
        run: go test -exec=true -timeout=120s ./...

  upload-coverage:
    name: Upload Coverage
    runs-on: ubuntu-latest
    needs: lint-build-test-linux
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: uring-root-coverage
          path: .

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./coverage.out
          disable_search: true
          flags: linux-amd64-root
          name: linux-amd64-root
          fail_ci_if_error: false

  cross-build:
    name: Cross-Build (${{ matrix.target.goos }}/${{ matrix.target.goarch }}, Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go-version: [ '1.26.x', 'stable' ]
        target:
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true

      - name: Build and compile tests
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          CGO_ENABLED: '0'
        run: |
          go build ./...
          go test -exec=true -timeout=120s ./...
